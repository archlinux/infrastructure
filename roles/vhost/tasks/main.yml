- name: Setup HTTP redirect
  include_role:
    name: http_redirect
  vars:
    domain: "{{ vhost_domain }}"

- name: Make nginx log dir
  file: path=/var/log/nginx/{{ vhost_domain }} state=directory owner=root group=root mode=755

- name: Install nginx conf file
  template: src=nginx.d.conf.j2 dest=/etc/nginx/nginx.d/{{ ansible_parent_role_names | first }}.conf owner=root group=root mode=640
  notify:
    - Reload nginx
